branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      # The plugin's behavior lives in markdown, so docs/refactor/perf
      # changes ship real content and must cut a release; only
      # chore/ci/test/build/style merges release nothing.
      releaseRules:
        - type: docs
          release: patch
        - type: refactor
          release: patch
        - type: perf
          release: patch
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      # Surface the release-worthy types in the notes; the preset hides
      # docs/refactor by default, which would leave those patch releases
      # with heading-only changelog entries.
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Bug Fixes
          - type: docs
            section: Documentation
          - type: refactor
            section: Refactoring
          - type: perf
            section: Performance Improvements
  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
  - - "@semantic-release/exec"
    - prepareCmd: >-
        jq --arg v "${nextRelease.version}" '.version = $v'
        plugins/mine-directives/.claude-plugin/plugin.json > plugin.json.tmp &&
        mv plugin.json.tmp plugins/mine-directives/.claude-plugin/plugin.json
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - plugins/mine-directives/.claude-plugin/plugin.json
      message: "chore(release): ${nextRelease.version} [skip ci]"
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      failTitle: false
